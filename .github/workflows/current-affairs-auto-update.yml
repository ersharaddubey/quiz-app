name: Six-hour current affairs and recruitment notice import

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

concurrency:
  group: examfoundery-current-affairs-import
  cancel-in-progress: false

jobs:
  import-current-affairs-and-recruitment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger secured allowlisted current affairs draft importer
        id: current_affairs
        continue-on-error: true
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CURRENT_AFFAIRS_IMPORT_SECRET: ${{ secrets.CURRENT_AFFAIRS_IMPORT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${BACKEND_URL:-}" || -z "${CURRENT_AFFAIRS_IMPORT_SECRET:-}" ]]; then
            echo "Set BACKEND_URL and CURRENT_AFFAIRS_IMPORT_SECRET in GitHub Actions secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --max-time 840 \
            -X POST "${BACKEND_URL%/}/api/automation/current-affairs/import" \
            -H "x-current-affairs-secret: ${CURRENT_AFFAIRS_IMPORT_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"trigger":"github-actions","reviewRequired":true}'

      - name: Trigger secured allowlisted recruitment draft importer
        id: job_alerts
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          JOB_ALERT_IMPORT_SECRET: ${{ secrets.JOB_ALERT_IMPORT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${BACKEND_URL:-}" || -z "${JOB_ALERT_IMPORT_SECRET:-}" ]]; then
            echo "Set BACKEND_URL and JOB_ALERT_IMPORT_SECRET in GitHub Actions secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --max-time 840 \
            -X POST "${BACKEND_URL%/}/api/automation/job-alerts/import" \
            -H "x-job-alert-import-secret: ${JOB_ALERT_IMPORT_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"trigger":"github-actions","reviewRequired":true}'

      - name: Report combined import result
        if: always()
        env:
          CURRENT_AFFAIRS_OUTCOME: ${{ steps.current_affairs.outcome }}
          JOB_ALERTS_OUTCOME: ${{ steps.job_alerts.outcome }}
        run: |
          {
            echo "## Government exam content import"
            echo ""
            echo "| Import | Result |"
            echo "|---|---|"
            echo "| Current Affairs | ${CURRENT_AFFAIRS_OUTCOME} |"
            echo "| Job Alerts | ${JOB_ALERTS_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CURRENT_AFFAIRS_OUTCOME" != "success" || "$JOB_ALERTS_OUTCOME" != "success" ]]; then
            echo "One or more importers failed. See individual step logs."
            exit 1
          fi
